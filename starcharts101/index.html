<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Star Charts 101 and Practices · Book & Observation Knowledge Graph</title>
  <meta name="description" content="Interactive companion to Star Charts 101 and Practices, including the live book contents and the IOAA 2025 observation knowledge graph.">
  <link rel="canonical" href="https://rajit13.github.io/starcharts101/">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #101319; }
    #site { width: 100%; height: 100%; border: 0; display: block; background: #101319; }
    #fallback { display: none; position: fixed; inset: 0; place-items: center; padding: 32px; box-sizing: border-box; color: #edf2fa; background: #101319; font: 16px/1.5 system-ui, sans-serif; text-align: center; }
    #fallback a { color: #85b7ff; }
  </style>
</head>
<body>
  <iframe id="site" src="graph.html" title="Star Charts 101 and Practices interactive companion"></iframe>
  <div id="fallback">
    <div>
      <h1>Star Charts 101 and Practices</h1>
      <p>The interactive companion could not be loaded.</p>
      <p><a href="graph.html">Open the graph directly</a></p>
    </div>
  </div>

  <script>
    (() => {
      'use strict';
      const frame = document.getElementById('site');
      const fallback = document.getElementById('fallback');
      const pdfPreview = 'https://raw.githubusercontent.com/Rajit13/Star-Maps-101-and-Practices/master/StarMaps101.pdf';
      const portfolioUrl = 'https://rajit13.github.io/';
      const astroPotdUrl = 'https://rajit13.github.io/website_docs/Astro_POTD.pdf';
      const bengaliBookUrl = 'https://www.rokomari.com/book/471442/jyotirbigganer-jotokichu';
      let attempts = 0;

      function patch() {
        let doc;
        try { doc = frame.contentDocument || frame.contentWindow.document; }
        catch (_) { return false; }
        if (!doc || !doc.body) return false;

        const authorLinks = doc.querySelector('.author-links');
        const bookArt = doc.querySelector('.book-art');
        const nav = doc.querySelector('.book-nav');
        const tocToggle = doc.getElementById('toc-toggle');
        const tocPanel = doc.getElementById('toc-panel');
        const footer = doc.querySelector('.license-foot');
        const workspace = doc.querySelector('main.workspace');
        if (!authorLinks || !bookArt || !nav || !tocToggle || !tocPanel || !footer || !workspace) return false;
        if (doc.documentElement.dataset.polished === 'true') return true;
        doc.documentElement.dataset.polished = 'true';
        doc.title = 'Star Charts 101 and Practices · Book & Observation Knowledge Graph';

        const style = doc.createElement('style');
        style.textContent = `
          .author-bar{background:#0d131d!important}
          .author-links .promo-link{display:none!important}
          .author-links .promo-link[href*="orcid.org"]{display:inline-flex!important}

          .author-id small{
            color:var(--green);
            font-size:10px;
            letter-spacing:1.5px;
            text-transform:uppercase
          }
          .author-id a{
            color:#7ec8ff!important;
            text-decoration:none!important;
            font-weight:700!important;
            font-size:2em!important;
            line-height:1.1!important;
            font-variant:small-caps;
            font-variant-caps:small-caps;
            letter-spacing:.08em;
            font-family:"Palatino Linotype","Book Antiqua",Georgia,serif;
          }
          .author-id a:hover{text-decoration:underline!important}

          .book-art{
            background:#07101b!important;
            border-color:#34465d!important;
            min-height:225px!important;
            padding:14px!important;
            box-shadow:inset 0 0 42px rgba(79,132,184,.08);
          }
          .book-art a{
            display:flex;
            align-items:center;
            justify-content:center;
            width:100%;
            height:100%;
            pointer-events:none!important;
            cursor:default!important;
          }
          .book-art img{
            width:100%!important;
            max-height:255px!important;
            object-fit:contain!important;
            background:transparent!important;
            filter:none!important;
            transform:rotate(180deg) scaleX(-1)!important;
            transform-origin:center!important;
          }
          .book-art figcaption{display:none!important}

          .book-copy h1{line-height:1.12!important}
          .book-copy h1 .graph-subtitle{
            display:inline-block;
            margin-top:6px;
            font-size:.76em;
            font-weight:620;
            color:#cbd5e5;
          }

          .book-nav #toc-toggle{
            background:#d9e9ff!important;
            color:#101319!important;
            border-color:#d9e9ff!important;
            font-weight:800!important;
            box-shadow:0 0 0 1px rgba(255,255,255,.08),0 5px 18px rgba(83,146,214,.18);
          }
          .book-nav #toc-toggle:hover{background:#fff!important}
          .toc-panel{display:block!important}
          .toc-head h2{font-size:21px!important}
          .toc-head h2::before{content:'★ ';color:var(--blue)}

          .toc-static{
            pointer-events:none!important;
            cursor:default!important;
          }
          .toc-static:hover{
            background:transparent!important;
            color:inherit!important;
          }

          .ioaa-context-footnote{
            margin:18px 30px 20px!important;
            padding:13px 15px!important;
            border:1px solid #34465d!important;
            border-left:3px solid var(--green)!important;
            border-radius:7px!important;
            background:#151b24!important;
            color:#cbd5e5!important;
            font-size:12px!important;
          }
          .ioaa-context-footnote strong{
            display:block;
            margin-bottom:4px;
            color:#eef4ff!important;
            font-size:13px!important;
          }

          .license-foot{
            display:flex!important;
            align-items:center!important;
            justify-content:space-between!important;
            gap:20px!important;
            flex-wrap:wrap!important;
          }
          .footer-license-copy{flex:1 1 620px}
          .additional-reading{
            flex:1 0 100%;
            border-top:1px solid var(--border);
            padding-top:14px;
            margin-top:2px;
          }
          .additional-reading strong{
            display:block;
            margin-bottom:7px;
            color:var(--text)!important;
            font-size:13px;
          }
          .additional-reading-links{
            display:flex;
            flex-wrap:wrap;
            gap:8px 16px;
          }
          .additional-reading a{
            display:inline-flex;
            align-items:center;
            gap:5px;
            color:var(--blue)!important;
            text-decoration:none;
          }
          .additional-reading a:hover{text-decoration:underline}
          .page-counter{
            display:flex;
            align-items:center;
            gap:8px;
            white-space:nowrap;
            padding:6px 10px;
            border:1px solid var(--border);
            border-radius:7px;
            background:#171d27
          }
          .page-counter span{
            color:var(--muted);
            font-size:11px;
            text-transform:uppercase;
            letter-spacing:.8px
          }
          .page-counter img{
            display:block;
            height:20px;
            max-width:160px
          }

          @media(max-width:850px){
            .author-id a{font-size:1.7em!important}
            .ioaa-context-footnote{margin-left:18px!important;margin-right:18px!important}
          }
          @media(max-width:540px){
            .book-art{min-height:190px!important}
            .book-art img{height:180px!important}
            .license-foot{align-items:flex-start!important}
            .author-id a{font-size:1.55em!important}
          }
        `;
        doc.head.appendChild(style);

        [...authorLinks.querySelectorAll('.promo-link')].forEach(link => {
          if (!link.href.includes('orcid.org')) link.remove();
        });

        const caption = bookArt.querySelector('figcaption');
        if (caption) caption.remove();

        const authorName = doc.querySelector('.author-id a');
        if (authorName) {
          authorName.textContent = 'Fahim Rajit Hossain Shwadhin';
          authorName.href = portfolioUrl;
          authorName.target = '_blank';
          authorName.rel = 'noopener';
          authorName.title = 'Open portfolio website';
        }

        const eyebrow = doc.querySelector('.book-copy .eyebrow');
        if (eyebrow) eyebrow.textContent = 'INTERACTIVE COMPANION TO THE BOOK';

        const title = doc.querySelector('.book-copy h1');
        if (title) {
          title.innerHTML = 'Star Charts 101 and Practices<br><span class="graph-subtitle">Book &amp; observation knowledge graph</span>';
        }

        const intro = doc.querySelector('.book-copy p');
        if (intro) {
          intro.innerHTML = '<strong>Star Charts 101 and Practices</strong> is a practice book dedicated to astronomy enthusiasts and students preparing for the Star Charts/Observational Round of Astronomy and Earth Science Olympiads. It is not a full star atlas; rather, it is intended as a practical problem-solving companion. The book draws on the author’s experience as a participant in two international Olympiads, an IOAA team leader since 2018, a stargazer, and an observational astronomer.';
        }

        const ioaaNote = doc.querySelector('.ioaa-note');
        if (ioaaNote) {
          ioaaNote.classList.add('ioaa-context-footnote');
          ioaaNote.innerHTML = '<strong>IOAA 2025 context</strong>The graph’s OM (Sky Map), OT (Telescope), and OP (Planetarium) nodes and task mappings refer specifically to the IOAA 2025 Observation Round.';
          workspace.insertAdjacentElement('afterend', ioaaNote);
        }

        tocPanel.classList.add('open');
        tocToggle.setAttribute('aria-expanded', 'true');
        tocToggle.textContent = 'Book contents ▴';

        [...doc.querySelectorAll('.toc-item')].forEach(link => {
          const div = doc.createElement('div');
          div.className = link.className + ' toc-static';
          div.innerHTML = link.innerHTML;
          link.replaceWith(div);
        });

        const order = ['toc-toggle', 'Interactive graph', 'Latest PDF', 'Repository', 'Releases'];
        const navItems = [...nav.children];
        const findItem = key => key === 'toc-toggle'
          ? doc.getElementById('toc-toggle')
          : navItems.find(el => el.tagName === 'A' && el.textContent.trim() === key);
        const spacer = nav.querySelector('.nav-spacer');
        order.forEach(key => {
          const el = findItem(key);
          if (el) nav.insertBefore(el, spacer || null);
        });

        [...doc.querySelectorAll('a')].forEach(link => {
          const text = link.textContent.trim();
          if (
            text === 'Latest PDF' ||
            /Download latest book PDF/i.test(text) ||
            /Open full PDF/i.test(text) ||
            link.href.includes('/releases/latest/download/StarMaps101.pdf') ||
            link.href.includes('/blob/master/StarMaps101.pdf')
          ) {
            link.href = pdfPreview;
            link.target = '_blank';
            link.rel = 'noopener';
          }
        });

        const originalFooterHtml = footer.innerHTML;
        footer.innerHTML = '';
        const copy = doc.createElement('div');
        copy.className = 'footer-license-copy';
        copy.innerHTML = originalFooterHtml;

        const reading = doc.createElement('div');
        reading.className = 'additional-reading';
        reading.innerHTML = `
          <strong>Additional reading for Astronomy Olympiad preparation by Fahim Rajit Hossain Shwadhin</strong>
          <div class="additional-reading-links">
            <a href="${astroPotdUrl}" target="_blank" rel="noopener">Astronomy Problem of the Day — problem collection PDF ↗</a>
            <a href="${bengaliBookUrl}" target="_blank" rel="noopener"><span lang="bn">জ্যোতির্বিজ্ঞানের যতকিছু — অলিম্পিয়াড ও অন্যান্য</span> ↗</a>
          </div>`;

        const counter = doc.createElement('div');
        counter.className = 'page-counter';
        counter.setAttribute('aria-label', 'Star Charts 101 and Practices page views');
        counter.innerHTML = '<span>Page views</span><img src="https://visitor-badge.laobi.icu/badge?page_id=Rajit13.StarMaps101.Interactive" alt="Star Charts 101 and Practices page view counter">';
        footer.append(copy, counter, reading);

        return true;
      }

      frame.addEventListener('load', () => {
        const timer = setInterval(() => {
          attempts += 1;
          if (patch() || attempts > 80) clearInterval(timer);
        }, 150);
      });

      frame.addEventListener('error', () => {
        frame.style.display = 'none';
        fallback.style.display = 'grid';
      });
    })();
  </script>
</body>
</html>
