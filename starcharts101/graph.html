<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Star Maps 101 · Interactive Observation Knowledge Graph</title>
  <meta name="description" content="Interactive Star Maps 101 knowledge graph connecting book material with IOAA 2025 OM, OT and OP observation tasks.">
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101319; color: #edf2fa; font: 16px/1.5 system-ui, sans-serif; }
    .loading { max-width: 680px; padding: 32px; text-align: center; }
    a { color: #85b7ff; }
  </style>
</head>
<body>
  <div id="status" class="loading">Loading the Star Maps 101 interactive knowledge graph…</div>
  <script>
    (async () => {
      const source = 'https://raw.githubusercontent.com/Rajit13/Star-Maps-101-and-Practices/master/star-maps-101-graph.html';
      try {
        const response = await fetch(source, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const html = await response.text();
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.getElementById('status').innerHTML =
          '<h1>Star Maps 101</h1>' +
          '<p>The interactive graph could not be loaded from the repository.</p>' +
          '<p><a href="https://github.com/Rajit13/Star-Maps-101-and-Practices/blob/master/star-maps-101-graph.html">Open the graph source on GitHub</a></p>';
        console.error(error);
      }
    })();
  </script>
</body>
</html>
